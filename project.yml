          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 97r2b46745.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
        # Must exactly match an entry in the backend's ALLOWED_MOBILE_SCHEMES
        # (sparklet repo: src/lib/mobile-auth.ts) and AppConfig.authCallbackScheme
        # — the one-time login code's deep-link redirect lands here. See
        # Auth/LoginController.swift and AGENTS.md's auth section.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - sparklet-ios
            CFBundleURLName: com.sparklet.ios.auth
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
    # Lets a tapped https://sparkletapp.com/invite/<id> link open this app
    # directly (NSUserActivityTypeBrowsingWeb, handled in SparkletApp.swift)
    # instead of just Safari. The entitlement alone isn't enough to activate
    # it — Apple also verifies a signed apple-app-site-association file at
    # https://sparkletapp.com/.well-known/apple-app-site-association whose
    # appID is "<TEAM_ID>.com.sparklet.ios". Not added to the backend yet:
    # there's no real Apple Developer Team ID configured in this project
    # (see DEVELOPMENT_TEAM above), and publishing an AASA with a made-up
    # team ID to production would just be silently wrong. Until then,
    # sharing still works via the plain https:// link (opens in Safari,
    # same as today) — this entitlement only upgrades that once a team ID
    # exists.
    entitlements:
      path: Sparklet/Sparklet.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:sparkletapp.com
  SparkletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SparkletTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Sparklet

# A full scheme spec (rather than the target's inline `scheme:` shorthand)
# so storeKitConfiguration is set on both the run AND test actions — the
# shorthand only wires it into the Run/Launch action.
#
# Neither actually helps from the command line, though: `xcrun simctl
# launch` is a bare process spawn that bypasses Xcode's scheme machinery
# entirely, and `xcodebuild test`/`build` never push a scheme's
# StoreKitConfigurationFileReference to the simulator at all — confirmed via
# `Product.products(for:)` returning empty regardless of which action
# referenced the file, then via a web search turning up
# https://developer.apple.com/forums/thread/798546 and others describing
# this as a known regression specific to iOS 26.5 simulators: only Xcode's
# own IDE process (the literal Run/Test buttons, or Cmd+U) can push the
# config, using an internal XPC path `xcodebuild` doesn't invoke. So
# `test:` here is real and will work the next time someone runs tests via
# Xcode's GUI — it just couldn't be verified from this CLI-only session.
schemes:
  Sparklet:
    build:
      targets:
        Sparklet: all
    run:
      config: Debug
      storeKitConfiguration: Sparklet/Sparklet.storekit
    test:
      config: Debug
      storeKitConfiguration: Sparklet/Sparklet.storekit
      targets:
        - SparkletTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
