name: Sparklet
options:
  bundleIdPrefix: com.sparklet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only for v1; add "1,2" for iPad later

packages:
  # First third-party dependency this app has — everything else is
  # first-party Swift. GoogleMobileAds's own Package.swift depends on
  # GoogleUserMessagingPlatform (UMP, the GDPR/ATT consent flow) and SPM
  # resolves it automatically, but that's a link-time detail only — our own
  # target still needs its own explicit `dependencies:` entry below (and
  # this matching `packages:` entry) before `import UserMessagingPlatform`
  # resolves in our Swift code. Confirmed by a real build failure
  # ("cannot find 'ConsentInformation' in scope" etc.) before this was added.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.7.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0

targets:
  Sparklet:
    type: application
    platform: iOS
    sources:
      - path: Sparklet
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sparklet.ios
        # No team set — fill in DEVELOPMENT_TEAM (or set it in Xcode's
        # Signing & Capabilities tab after generating the project) once you
        # have an Apple Developer account attached.
        ENABLE_PREVIEWS: "YES"
    # All Info.plist keys are set here as raw plist entries rather than via
    # INFOPLIST_KEY_* build settings — mixing the two mechanisms with an
    # explicit `info.path` file (below) is a real ambiguity in
    # xcodegen/xcodebuild about which one wins.
    info:
      path: Sparklet/Info.plist
      properties:
        CFBundleDisplayName: Sparklet
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Google's public test AdMob app id (ca-app-pub-3940256099942544~...
        # is Google's own documented sample id, safe to ship — never resolves
        # to real ad inventory or spend). Swap for the app's own id from the
        # AdMob console once one is created (see AGENTS.md) — ads on a real
        # device/build with this test id would otherwise show only Google's
        # test creatives forever, not real inventory.
        GADApplicationIdentifier: "ca-app-pub-3940256099942544~1458002511"
        # Only shown if AdsManager actually requests ATT (see its comment on
        # why the UMP consent flow decides that, not this string's presence
        # alone) — copy matches the tone of the web's own ad framing
        # ("Sponsored" label in AdSlide.tsx), not a generic template line.
        NSUserTrackingUsageDescription: "Sparklet shows ads to free-tier users. Allowing tracking lets those ads be more relevant instead of random."
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
