name: Sparklet
options:
  bundleIdPrefix: com.sparklet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only for v1; add "1,2" for iPad later

targets:
  Sparklet:
    type: application
    platform: iOS
    sources:
      - path: Sparklet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sparklet.ios
        # No team set — fill in DEVELOPMENT_TEAM (or set it in Xcode's
        # Signing & Capabilities tab after generating the project) once you
        # have an Apple Developer account attached.
        ENABLE_PREVIEWS: "YES"
    # All Info.plist keys are set here as raw plist entries rather than via
    # INFOPLIST_KEY_* build settings — mixing the two mechanisms with an
    # explicit `info.path` file (below) is a real ambiguity in
    # xcodegen/xcodebuild about which one wins.
    info:
      path: Sparklet/Info.plist
      properties:
        CFBundleDisplayName: Sparklet
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Must exactly match an entry in the backend's ALLOWED_MOBILE_SCHEMES
        # (sparklet repo: src/lib/mobile-auth.ts) and AppConfig.authCallbackScheme
        # — the one-time login code's deep-link redirect lands here. See
        # Auth/LoginController.swift and AGENTS.md's auth section.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - sparklet-ios
            CFBundleURLName: com.sparklet.ios.auth
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
    # Lets a tapped https://sparkletapp.com/invite/<id> link open this app
    # directly (NSUserActivityTypeBrowsingWeb, handled in SparkletApp.swift)
    # instead of just Safari. The entitlement alone isn't enough to activate
    # it — Apple also verifies a signed apple-app-site-association file at
    # https://sparkletapp.com/.well-known/apple-app-site-association whose
    # appID is "<TEAM_ID>.com.sparklet.ios". Not added to the backend yet:
    # there's no real Apple Developer Team ID configured in this project
    # (see DEVELOPMENT_TEAM above), and publishing an AASA with a made-up
    # team ID to production would just be silently wrong. Until then,
    # sharing still works via the plain https:// link (opens in Safari,
    # same as today) — this entitlement only upgrades that once a team ID
    # exists.
    entitlements:
      path: Sparklet/Sparklet.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:sparkletapp.com
    scheme:
      testTargets:
        - SparkletTests

  SparkletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SparkletTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Sparklet
